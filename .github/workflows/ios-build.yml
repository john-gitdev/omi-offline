name: iOS build (verify)

# Cloud iOS build on a GitHub-hosted macOS runner — builds the app for iOS 15.0
# without needing a local Mac, and packages an UNSIGNED .ipa as a downloadable
# artifact. The unsigned IPA installs on a jailbroken device via AppSync Unified
# (or via TrollStore on iOS 14–16.x) — no Apple Developer account or signing.
#
# Manual trigger only, to conserve macOS minutes (billed 10x on private repos).

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: flutter build ios (dev, no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Generate iOS config (plugins + Generated.xcconfig)
        run: flutter build ios --flavor dev --no-codesign --config-only

      - name: pod install (fails loudly if a pod rejects iOS 15.0)
        working-directory: app/ios
        run: pod install --repo-update

      - name: Build iOS (dev flavor, no code signing)
        run: flutter build ios --flavor dev --no-codesign

      - name: Package unsigned IPA (installs via AppSync Unified / TrollStore)
        run: |
          APP_PATH="$(ls -d build/ios/iphoneos/*.app | head -n1)"
          echo "Packaging: $APP_PATH"
          rm -rf Payload omi-offline-dev-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry omi-offline-dev-unsigned.ipa Payload
          ls -lh omi-offline-dev-unsigned.ipa
          echo "Built against:"; grep "platform :ios" ios/Podfile

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: omi-offline-dev-unsigned-ipa
          path: app/omi-offline-dev-unsigned.ipa
          if-no-files-found: error
