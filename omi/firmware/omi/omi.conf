CONFIG_DISK_ACCESS=y

# No filesystem: audio is a raw append-only circular log written straight to the
# SD NAND's sectors (sd_ring.c). LittleFS was retired in oo-2.9.0 — its block
# allocator ran a full-FS traversal on the sd_worker thread once the lookahead
# window drained, stalling the write path and dropping audio on a full card.
# Dropping it also returns 29,748 B of .bss, measured: ~25 KB of that is its six
# 4 KB caches (read/prog/lookahead + one per open file handle) plus the shared
# sector scratch, ~3 KB is the write-batch buffer the ring's append stage used to
# be unioned with, and the rest is the lfs_t instance, the file handles and the
# FS subsystem's own statics. Same figure the CHANGELOG quotes as 29 KB of RAM.
# CONFIG_SPI=y
