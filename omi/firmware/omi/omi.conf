# NOTE: do NOT set CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y here. It was tried as a
# way to let a phone that lost its side of the bond re-pair without the 5-tap
# unpair gesture, and reverted: with MAX_PAIRED=1 and KEYS_OVERWRITE_OLDEST unset,
# a *different*-address peer already cannot pair (key storage full), so the only
# thing that flag changes is whether a peer presenting the BONDED phone's identity
# address may overwrite its Just Works LTK. Omi has no IO capabilities, so that
# pairing is unauthenticated and unprompted — an attacker in range while the phone
# is away would gain the encrypted GATT, i.e. every recording on the card, and lock
# the real phone out. If the recovery path is wanted, gate it on user presence with
# a bt_conn_auth_cb.pairing_accept callback (see BLE_Research.md §9) rather than
# opening the overwrite unconditionally.
CONFIG_BT_DEVICE_APPEARANCE=22
CONFIG_BT_GATT_DYNAMIC_DB=y

# TX power is deliberately NOT set here. This file configures the APPLICATION core,
# which runs the BLE host only: boards/omi/Kconfig.defconfig gives cpuapp
# BT_HCI_IPC and gives BT_CTLR to cpunet, so every BT_CTLR_* symbol belongs to the
# network core. The controller's TX power lives in
# boards/omi/omi_nrf5340_cpunet_defconfig — CONFIG_BT_CTLR_TX_PWR_PLUS_3, the
# nRF5340 maximum, alongside CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL, which also
# allows changing it at runtime over HCI.
#
# A "CONFIG_BT_CTLR_TX_PWR_ANTENNA=8" line sat here for a long time doing nothing:
# wrong core, and +8 dBm is the nRF52840's ceiling, not this chip's. Its own
# comment said "nRF52840" outright — it arrived by copy-paste. Do not add it back.
# If range is ever to be traded for current, edit the cpunet defconfig; but note
# idle TX duty is ~0.1% (one ~1 s advertising event, three channels), so the whole
# +3 -> 0 dBm move is worth single-digit uA, against 3 dB of link margin on a
# device whose acquisition is already marginal (BLE_Research.md, Wedge 9).
CONFIG_BT_PHY_UPDATE=y

